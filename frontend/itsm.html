<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ITSM · карточка инцидента</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/itsm.css">
</head>
<body class="itsm">
  <div id="itsm-session" class="session-content" hidden inert>
  <header class="itsm-header">
    <img class="arm-brand-mark" src="/mts-mark.svg" alt="МТС" width="36" height="36">
    <b>ITSM / Инциденты</b>
    <button type="button" class="icon-btn" data-theme-toggle aria-label="Тёмная тема" aria-pressed="false">
      <svg class="ui-icon theme-moon" aria-hidden="true" focusable="false"><use href="/icons.svg#moon"></use></svg>
      <svg class="ui-icon theme-sun" aria-hidden="true" focusable="false"><use href="/icons.svg#sun"></use></svg>
    </button>
    <span id="me"></span>
  </header>
  <a class="itsm-back" href="/"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#left"></use></svg> К АРМ координатора</a>
  <div id="root" class="err">Загрузка…</div>

  </div>
  <div id="itsm-session-error" class="itsm-session-error" role="status" hidden>
    Не удалось проверить сессию. <a href="/">Ко входу в АРМ</a>
  </div>

  <script type="module">
    import { api } from "/js/api.js";
    import { activateSession, loadProfile, loginLocation, returnPath, sessionFetch } from "/js/session.js";
    import { esc, fmtTimer } from "/js/format.js";
    import { aiEnabled } from "/js/ai-mode.js";

    const path = returnPath(location.pathname);
    const id = path === "/" ? null : decodeURIComponent(path.slice("/itsm/".length));
    const root = document.getElementById("root");
    const workspace = document.getElementById("itsm-session");
    let sessionSignal;

    const dt = (iso) => iso ? new Date(iso).toLocaleString("ru-RU", { timeZone: "Europe/Moscow", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + " МСК" : "—";
    // datetime-local ⇄ UTC ISO, поле в МСК (UTC+3)
    const toLocalMsk = (iso) => iso ? new Date(Date.parse(iso) + 3 * 3600e3).toISOString().slice(0, 16) : "";
    const fromLocalMsk = (v) => new Date(Date.parse(v + ":00Z") - 3 * 3600e3).toISOString().replace(".000Z", "Z");

    let meta = null, inc = null, lastHash = null, message = null, useAI = false, readingMode = false, reading = false, writing = false, editVersion = 0;

    async function readMode() {
      if (readingMode) return;
      readingMode = true;
      try {
        const response = await sessionFetch("/api/health", { signal: AbortSignal.timeout(2000) });
        if (!response.ok) return;
        const enabled = aiEnabled({ ai_status: (await response.json()).ai });
        sessionSignal.throwIfAborted();
        if (enabled !== useAI) {
          useAI = enabled;
          if (inc && !writing) render();
        }
      } catch { /* keep the last known mode */ }
      finally { readingMode = false; }
    }

    async function load() {
      if (sessionSignal.aborted || reading || writing) return;
      reading = true;
      const version = editVersion;
      readMode();
      try {
        meta = meta || await api.meta();
        const fresh = await api.incident(id);
        if (version !== editVersion) return;
        if (fresh.hash !== lastHash) {
          inc = fresh;
          lastHash = fresh.hash;
          render();
        } else {
          const status = root.querySelector(".msg");
          if (status?.textContent.startsWith("Не удалось обновить инцидент.")) {
            status.className = `msg ${message?.kind || ""}`;
            status.textContent = message?.text || "";
          }
        }
      } catch (e) {
        if (sessionSignal.aborted || version !== editVersion) return;
        if (inc) {
          const status = root.querySelector(".msg");
          status.className = "msg err";
          status.textContent = `Не удалось обновить инцидент. Показаны последние данные. ${e.message}`;
        } else {
          root.className = "err";
          root.textContent = `Не удалось загрузить ${id}. ${e.message}`;
        }
      } finally { reading = false; }
    }

    function render() {
      document.title = `${inc.id} · ITSM`;
      root.className = "";
      const transitions = meta.transitions[inc.state_id] || [];
      const route = useAI && inc.ai?.route?.team ? inc.ai.route : null;
      const suggested = route ? [route.team, ...(route.alternatives || []).map((a) => a.team)] : [];
      const teams = [...suggested, ...meta.teams.filter((t) => !suggested.includes(t))].filter((t) => t !== inc.team);
      const doneState = (s) => [7, 10, 20].includes(Number(s));
      const comment = root.querySelector("#f-comment textarea");
      const draft = comment?.value || "";
      const activeElement = root.contains(document.activeElement) ? document.activeElement : null;
      const commentSelection = comment && [comment.selectionStart, comment.selectionEnd, comment.selectionDirection];
      root.innerHTML = `<main>
        <div class="itsm-intro"><div>
          <div class="id">${esc(inc.id)} · МИ · ${esc(inc.product || "")}</div>
          <h1>${esc(inc.title)}</h1>
          <div class="badges">
            <span class="badge ${["resolved","closed","research"].includes(inc.state_kind) ? "done" : ""}">${esc(inc.state)}</span>
            <span class="badge ${inc.priority_level === "critical" ? "crit" : ""}">${esc(inc.priority)}</span>
            <span class="hint">Создан ${dt(inc.created_at)}</span>
          </div>
          </div><div class="panel-sla corners${inc.priority_level === "critical" && inc.is_active ? " critical-corners" : ""}">
            <span>Срок решения · SLA</span>
            <strong id="itsm-countdown"></strong>
            ${inc.deadline ? `<small>До ${dt(inc.deadline)}</small>` : ""}
          </div>
        </div>
        <section class="itsm-controls corners">
          <h2>Управление инцидентом</h2>
          <div class="msg ${message ? message.kind : ""}" role="status">${message ? esc(message.text) : ""}</div>
          ${message?.conflict ? `<button type="button" class="sec" id="itsm-refresh">Обновить карточку</button>` : ""}
          <h3>Группа исполнителей</h3>
          ${inc.state_kind === "closed" ? `<div class="hint">Инцидент закрыт — переназначение невозможно, повтор = новый инцидент.</div>` :
            inc.state_kind === "resolved" ? `<div class="hint">Инцидент завершён — чтобы переназначить, сначала верните его в работу.</div>` : `
          <form class="form" id="f-assign">
            <select name="team" aria-label="Группа исполнителей" required>
              ${route ? "" : `<option value="" selected disabled>— выберите команду —</option>`}
              ${teams.map((t, i) => `<option value="${esc(t)}" ${route && i === 0 ? "selected" : ""}>${route && suggested.includes(t) ? "Рекомендовано · " : ""}${esc(t)}</option>`).join("")}
            </select>
            <input name="assignee" aria-label="Инженер (необязательно)" placeholder="Инженер (необязательно)">
            <button>Назначить</button>
          </form>
          ${route ? `<div class="hint">Рекомендация по похожим случаям: «${esc(route.team)}» — ${esc(route.reason)}</div>` : ""}`}

          <h2>Статус</h2>
          ${transitions.length ? `<form class="form" id="f-state">
            <select name="state" aria-label="Новый статус" required>
              <option value="">Выберите новый статус</option>
              ${transitions.map((s) => `<option value="${s}">${esc(meta.states[s])}</option>`).join("")}
            </select>
            <select name="reason" aria-label="Причина смены статуса" hidden disabled>
              <option value="">Укажите причину</option>
              <option>Постоянное решение</option><option>Внешняя обработка</option><option>Инцидент самоустранился</option><option>Дубль</option><option>Инцидент не подтверждён</option>
            </select>
            <button class="sec">Обновить статус</button>
          </form>`
            : `<div class="hint">Финальный статус — переходов нет.</div>`}

          <h2>Приоритет и срок</h2>
          <form class="form" id="f-prio">
            <select name="priority" aria-label="Приоритет">${Object.entries(meta.priorities).sort((a, b) => b[0] - a[0]).map(([k, v]) => `<option value="${k}" ${Number(k) === inc.priority_id ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>
            <label class="hint"><input type="checkbox" name="recalc"> пересчитать срок по SLA</label>
            <button>Сохранить приоритет</button>
          </form>
          <form class="form" id="f-deadline">
            <input type="datetime-local" name="deadline" aria-label="Срок решения в Москве" value="${toLocalMsk(inc.deadline)}"> <span class="hint">МСК</span>
            <button>Сохранить срок</button>
          </form>

          <h2>Комментарий</h2>
          <form class="form" id="f-comment"><textarea name="text" rows="2" aria-label="Комментарий в журнал" placeholder="Что сделано, с кем договорились…"></textarea><button>Добавить в журнал</button></form>
          ${inc.state_kind === "active" ? `<button class="sec" id="b-escalate">Эскалировать руководителю группы</button>` : ""}

        </section>
        <div class="itsm-context">
        <section class="corners">
          <h2>Описание</h2><p>${esc(inc.description || "—")}</p>
          ${inc.solution ? `<h3>Решение</h3><p>${esc(inc.solution)}</p>` : ""}
          <dl>
            <dt>Продукт</dt><dd>${esc(inc.product || "—")}</dd>
            <dt>Сервис</dt><dd>${esc(inc.service || "—")}</dd>
            <dt>Группа</dt><dd>${esc(inc.team || "—")}</dd>
            <dt>Координатор</dt><dd>${esc(inc.coordinator?.name || "Не назначен")}</dd>
            <dt>Исполнитель</dt><dd>${esc(inc.assignee || "—")}</dd>
            <dt>Зарегистрирован</dt><dd>${dt(inc.created_at)}</dd>
            <dt>Срок решения</dt><dd>${dt(inc.deadline)}</dd>
            <dt>Завершён</dt><dd>${dt(inc.resolved_at)}</dd>
            <dt>Влияние / срочность</dt><dd>${esc(inc.impact || "—")} / ${esc(inc.urgency || "—")}</dd>
            <dt>Тип сервиса</dt><dd>${esc(inc.service_type || "—")}</dd>
            <dt>Канал</dt><dd>${esc(inc.channel || "—")}</dd>
            <dt>Инициатор</dt><dd>${esc(inc.initiator || "—")}</dd>
          </dl>
        </section>
        <section class="corners">
          <h2>Журнал работ</h2>
          <div class="log">${inc.work_log.length ? inc.work_log.slice().reverse().map((w) => `<div><small>${dt(w.at)} · ${esc(w.author || "")}</small><br>${esc(w.text || "")}</div>`).join("") : `<span class="hint">записей нет</span>`}</div>
          <h2>Исходная запись</h2>
          <details><summary>показать JSON</summary><pre>${esc(JSON.stringify(inc.raw, null, 2))}</pre></details>
        </section>
        </div>
      </main>`;
      const nextComment = root.querySelector("#f-comment textarea");
      nextComment.value = draft;
      if (commentSelection) nextComment.setSelectionRange(...commentSelection);
      if (comment && activeElement === comment) nextComment.focus({ preventScroll: true });
      bind(doneState);
      tickSla();
    }

    async function run(fn, okText, clearComment = false) {
      if (sessionSignal.aborted || writing) return;
      writing = true;
      editVersion++;
      try {
        inc = await fn();
        lastHash = inc.hash;
        message = { kind: "ok", text: okText };
        if (clearComment) root.querySelector("#f-comment textarea").value = "";
      } catch (e) {
        message = { kind: "err", text: e.message, conflict: e.status === 409 };
      } finally { writing = false; }
      if (!sessionSignal.aborted) render();
    }

    function bind(doneState) {
      const f = (sel) => document.querySelector(sel);
      if (f("#itsm-refresh")) f("#itsm-refresh").onclick = load;
      if (f("#f-assign")) f("#f-assign").onsubmit = (e) => { e.preventDefault(); const t = e.target.team.value;
        run(() => api.assign(id, t, null, e.target.assignee.value.trim() || null, inc.hash), `Назначен в «${t}»`); };
      const statusForm = f("#f-state");
      if (statusForm) {
        statusForm.state.onchange = () => {
          const required = doneState(statusForm.state.value);
          statusForm.reason.hidden = !required;
          statusForm.reason.disabled = !required;
          statusForm.reason.required = required;
        };
        statusForm.onsubmit = (event) => {
          event.preventDefault();
          const state = Number(statusForm.state.value);
          run(() => api.state(id, state, null, doneState(state) ? statusForm.reason.value : null, inc.hash), `Статус: ${meta.states[state]}`);
        };
      }
      f("#f-prio").onsubmit = (e) => { e.preventDefault();
        run(() => api.priority(id, Number(e.target.priority.value), e.target.recalc.checked, null, inc.hash), "Приоритет сохранён"); };
      f("#f-deadline").onsubmit = (e) => { e.preventDefault(); if (!e.target.deadline.value) return;
        run(() => api.deadline(id, fromLocalMsk(e.target.deadline.value), null, inc.hash), "Срок сохранён"); };
      f("#f-comment").onsubmit = (e) => { e.preventDefault(); const t = e.target.text.value.trim(); if (!t) return;
        run(() => api.comment(id, t, inc.hash), "Комментарий добавлен", true); };
      if (f("#b-escalate")) f("#b-escalate").onclick = () => run(() => api.escalate(id, null, inc.hash), "Эскалация записана");
    }

    function tickSla() {
      const el = document.getElementById("itsm-countdown");
      if (!el) return;
      const remaining = (Date.parse(inc.deadline) - Date.now()) / 1000;
      el.textContent = !inc.deadline ? "Срок не задан" : inc.is_active ? fmtTimer(remaining) : inc.state;
      el.classList.toggle("overdue", inc.is_active && remaining < 0);
    }

    async function start() {
      const profile = await loadProfile();
      if (!profile || !id) {
        location.replace(loginLocation());
        return;
      }
      const timers = [];
      sessionSignal = activateSession(profile, () => {
        workspace.hidden = workspace.inert = true;
        timers.forEach(clearInterval);
        root.replaceChildren();
        inc = meta = null;
      });
      document.getElementById("me").textContent = profile.display_name;
      workspace.hidden = workspace.inert = false;
      load();
      timers.push(setInterval(tickSla, 1000), setInterval(load, 2000));
    }
    start().catch(() => {
      document.getElementById("itsm-session-error").hidden = false;
    });
  </script>
</body>
</html>
