<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>АРМ координатора МИ · МТС</title>
  <link rel="icon" id="favicon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="arm">
  <header class="topbar" id="topbar">
    <div class="brand">
      <div class="brand-mark">МТС</div>
      <div class="brand-title">АРМ координатора</div>
    </div>
    <nav class="counters" id="counters"></nav>
    <div class="topbar-right">
      <input id="search" class="search" type="search" placeholder="Поиск  ( / )" autocomplete="off" title="Номер, продукт, команда, сотрудник, координатор, текст — по всем инцидентам">
      <button class="icon-btn" id="sound-btn"></button>
      <button class="icon-btn" id="voice-btn"></button>
      <div class="clock" id="clock"></div>
      <div class="status" id="status"></div>
      <div class="menu-wrap">
        <button class="icon-btn" id="me" title="Сменить имя"></button>
        <button class="icon-btn" id="menu-btn" title="Ещё">⋯</button>
        <div class="popover menu-pop hidden" id="menu-pop">
          <a href="/wall" target="_blank">🖥 Открыть видеостену</a>
          <button id="export-btn">⭳ Экспорт файла инцидентов</button>
          <button id="import-btn">⭱ Импорт файла инцидентов</button>
          <input type="file" id="import-input" accept=".json,application/json" hidden>
        </div>
      </div>
    </div>
  </header>

  <div id="filebar" class="filebar hidden"></div>
  <section id="alerts" class="alerts"></section>

  <section class="toolbar">
    <div class="tabs">
      <button class="tab active" data-view="queue">Очередь <b id="queue-count"></b></button>
      <button class="tab" data-view="board">Группы</button>
      <button class="tab" data-view="outages">Сбои</button>
      <button class="tab" data-view="mine">Мои <b id="mine-count" class="soft"></b></button>
      <button class="tab" data-view="feed">Лента <b id="feed-count"></b></button>
    </div>
    <div class="filters" id="filters"></div>
  </section>

  <div class="workspace" id="workspace">
    <main class="board hidden" id="board"></main>
    <section class="personal-queue" id="queue" aria-label="Очередь координатора">
      <div class="queue-feedback" hidden>
        <span id="queue-status" role="status"></span>
        <button type="button" class="btn small" id="queue-retry" hidden>Обновить</button>
      </div>
      <div class="queue" id="queue-items"></div>
    </section>
    <section class="outages-view hidden" id="outages" aria-label="Сбои">
      <div class="outage-feedback">
        <span id="outage-status" role="status"></span>
        <button class="btn small hidden" id="outage-refresh">Обновить снимок</button>
      </div>
      <div id="outage-list"></div>
    </section>
    <section class="queue hidden" id="mine"></section>
    <section class="feedview hidden" id="feedview"></section>
    <section class="results hidden" id="results"></section>
    <aside class="panel hidden" id="drawer"></aside>
  </div>

  <div class="modal hidden" id="modal"></div>
  <div class="toasts" id="toasts"></div>

  <div class="overlay" id="start-overlay">
    <div class="start-card">
      <div class="brand-mark big">МТС</div>
      <h1>Начать смену</h1>
      <p>Представьтесь — имя видно коллегам и на видеостене: кто взял инцидент в работу.</p>
      <input id="me-input" class="name-input" placeholder="Имя и фамилия" autocomplete="name">
      <p class="small">Браузер разрешает звук, голос и уведомления только после нажатия кнопки. Звук и голос потом включаются отдельно в шапке.</p>
      <button class="btn btn-primary big" id="start-btn">Начать смену</button>
      <button class="btn btn-ghost" id="start-silent">Без звука</button>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
