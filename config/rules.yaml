# Правила распределения инцидентов по группам.
# Меняет только A (владелец бэкенда). После правки перезапустите сервер и прогоните тесты.

# Статусы (stateId). Тексту state не доверяем: в описании полей 7 и 10 перепутаны.
states:
  0:  {name: "Назначен",              kind: active}
  2:  {name: "Выполняется",           kind: active}
  7:  {name: "Завершен",              kind: resolved}   # проблему устранили, может вернуться в работу
  10: {name: "Закрыт",                kind: closed}     # работа окончена, назад не возвращается
  20: {name: "Исследование ситуации", kind: research}   # решён, идёт разбор причин (нет в описании полей)

# Запасной разбор, если stateId нет или он неизвестен
state_enum:
  Assigned: 0
  WorkInProgress: 2
  Resolved: 7
  Closed: 10
  Research: 20

# Приоритет (priorityId). 4 = Наивысший = «критический»
priorities:
  4: {name: "Наивысший", level: critical}
  3: {name: "Высокий",   level: high}
  2: {name: "Средний",   level: medium}
  1: {name: "Низкий",    level: low}

priority_text:
  Наивысший: 4
  Высокий: 3
  Средний: 2
  Низкий: 1

coordinators_team: "КЦ ИТ Координаторы Массовых Инцидентов"

# Порядок групп = порядок колонок на экране
groups:
  critical:
    title: "Критические"
    priority_ids: [4]
    state_ids: [0, 2]
    # Окно показа завершённых. Для статуса «Закрыт» сервер ограничивает его пятью минутами.
    show_resolved_minutes: 30
  coordinators:
    title: "На координаторах"
    teams: ["КЦ ИТ Координаторы Массовых Инцидентов"]
    state_ids: [0, 2, 20]
    show_resolved_minutes: 30
  high:
    title: "Высокий приоритет"
    priority_ids: [3]
    state_ids: [0, 2]
    show_resolved_minutes: 30
  research:
    title: "Исследование ситуации"
    state_ids: [20]
    show_resolved_minutes: 5  # после закрытия из исследования

# Допустимые переходы статусов (менторы разрешили задать свои правила).
# 10 Закрыт — финальный: повтор проблемы = новый инцидент.
transitions:
  0:  [2, 7]        # Назначен → Выполняется / Завершен
  2:  [0, 7]        # Выполняется → Назначен (вернуть) / Завершен
  7:  [2, 10, 20]   # Завершен → вернуть в работу / Закрыт / Исследование ситуации
  20: [10]          # Исследование → Закрыт
  10: []

# Срок решения по приоритету, часов (для пересчёта срока при смене приоритета).
# Высокий ≈ 6 ч и Средний ≈ 12 ч — как в выгрузке; Наивысший — наше допущение.
sla_hours:
  4: 2
  3: 6
  2: 12
  1: 72
